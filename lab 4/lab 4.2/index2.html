<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заказ товара</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Форма заказа</h1>

<form id="orderForm">

    <h2>Контактные данные</h2>

    <label>Имя:</label>
    <input type="text" id="name">
    <span id="nameError"></span>

    <label>Email:</label>
    <input type="email" id="email">
    <span id="emailError"></span>

    <label>Телефон:</label>
    <input type="text" id="phone">
    <span id="phoneError"></span>


    <h2>Доставка</h2>

    <label>Адрес:</label>
    <input type="text" id="address">
    <span id="addressError"></span>

    <label>Способ доставки:</label>

    <label>
        <input type="radio" name="delivery" value="courier">
        Курьер
    </label>

    <label>
        <input type="radio" name="delivery" value="pickup">
        Самовывоз
    </label>

    <span id="deliveryError"></span>


    <h2>Оплата</h2>

    <label>Способ оплаты:</label>

    <label>
        <input type="radio" name="payment" value="card">
        Банковская карта
    </label>

    <label>
        <input type="radio" name="payment" value="cash">
        Наличными
    </label>

    <span id="paymentError"></span>


    <h2>Согласие</h2>

    <label>
        <input type="checkbox" id="agreement">
        Я согласен с правилами
    </label>

    <span id="agreementError"></span>

    <button type="submit">Оформить заказ</button>

</form>


<div id="preview">
    <h2>Предварительный просмотр</h2>

    <p>Имя: <span id="previewName">—</span></p>
    <p>Email: <span id="previewEmail">—</span></p>
    <p>Телефон: <span id="previewPhone">—</span></p>
    <p>Адрес: <span id="previewAddress">—</span></p>
    <p>Доставка: <span id="previewDelivery">—</span></p>
    <p>Оплата: <span id="previewPayment">—</span></p>
</div>

<p id="success"></p>

<script src="script.js"></script>

</body>
</html>
