
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог фильмов</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Каталог фильмов</h1>
            <p>Добавляй, оценивай и находи любимые фильмы</p>
        </header>

        <section class="panel">
            <h2>Добавить фильм</h2>

            <form id="filmForm">
                <label for="title">Название фильма</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Например, Интерстеллар"
                    maxlength="100"
                    required
                >

                <label for="genre">Жанр</label>
                <select id="genre" required>
                    <option value="">Выберите жанр</option>
                    <option value="Фантастика">Фантастика</option>
                    <option value="Драма">Драма</option>
                    <option value="Комедия">Комедия</option>
                    <option value="Боевик">Боевик</option>
                    <option value="Ужасы">Ужасы</option>
                    <option value="Триллер">Триллер</option>
                    <option value="Мультфильм">Мультфильм</option>
                    <option value="Приключения">Приключения</option>
                    <option value="Другое">Другое</option>
                </select>

                <label for="rating">Рейтинг (от 0 до 10)</label>
                <input
                    type="number"
                    id="rating"
                    min="0"
                    max="10"
                    step="0.1"
                    placeholder="Например, 8.5"
                    required
                >

                <button type="submit">Добавить фильм</button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section class="panel">
            <h2>Моя коллекция</h2>

            <div class="filters">
                <input
                    type="search"
                    id="search"
                    placeholder="Поиск по названию..."
                    aria-label="Поиск по названию"
                >

                <select id="genreFilter" aria-label="Фильтр по жанру">
                    <option value="">Все жанры</option>
                    <option value="Фантастика">Фантастика</option>
                    <option value="Драма">Драма</option>
                    <option value="Комедия">Комедия</option>
                    <option value="Боевик">Боевик</option>
                    <option value="Ужасы">Ужасы</option>
                    <option value="Триллер">Триллер</option>
                    <option value="Мультфильм">Мультфильм</option>
                    <option value="Приключения">Приключения</option>
                    <option value="Другое">Другое</option>
                </select>

                <select id="minRating" aria-label="Фильтр по рейтингу">
                    <option value="0">Любой рейтинг</option>
                    <option value="5">От 5 баллов</option>
                    <option value="7">От 7 баллов</option>
                    <option value="8">От 8 баллов</option>
                    <option value="9">От 9 баллов</option>
                </select>
            </div>

            <p id="filmCount">Всего фильмов: 0</p>
            <div id="filmList" class="film-list"></div>
        </section>

        <footer>
            Данные сохраняются в localStorage браузера.
        </footer>
    </div>
</body>
</html>
